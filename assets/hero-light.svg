<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Emre Çancıoğlu: Digitalization &amp; AI Supervisor. Bilingual (EN/TR) résumé and cover letter built with LaTeX and Awesome-CV"><title>Emre Çancıoğlu: Digitalization &amp; AI Supervisor. Bilingual (EN/TR) résumé and cover letter built with LaTeX and Awesome-CV</title><style>text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; } 
