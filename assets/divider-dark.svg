<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label=""><title></title><style>text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; } 
    .fade { opacity: 0; animation: fade .7s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pulse { stroke-dasharray: 16 600; stroke-dashoffset: 616; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: 0; } }
 .glint { opacity: .8; animation: glint 4s ease-in-out infinite; }
    @keyframes glint { from { transform: translateX(-120px); } to { transform: translateX(1200px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }</style><defs><linearGradient id="d" x1="0" x2="1"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient></defs>
    <rect x="0" y="11" width="1200" height="2" fill="url(#d)" opacity=".5"/>
    <rect x="0" y="10" width="120" height="4" rx="2" fill="#38bdf8" class="glint"/></svg>