<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#0a2540;#0b1220" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0395DE">
        <animate attributeName="stop-color" values="#0395DE;#06b6d4;#0395DE" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <!-- drifting circuit-like dots -->
    <g fill="#ffffff" opacity="0.18">
      <circle cx="80" cy="50" r="3"><animate attributeName="cy" values="50;70;50" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="200" r="4"><animate attributeName="cy" values="200;180;200" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="40" r="2.5"><animate attributeName="cx" values="420;450;420" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="220" r="3.5"><animate attributeName="cy" values="220;195;220" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="60" r="3"><animate attributeName="cx" values="820;790;820" dur="7s" repeatCount="indefinite"/></circle>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" fill="none">
      <path d="M0 200 H120 L150 170 H330"/>
      <path d="M900 60 H760 L730 90 H600"/>
      <path d="M0 110 H60 L90 80 H200" />
    </g>
    <!-- moving wave -->
    <path fill="#ffffff" fill-opacity="0.08" d="M0 230 Q 150 190 300 230 T 600 230 T 900 230 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; -300 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path fill="#ffffff" fill-opacity="0.06" d="M0 240 Q 150 210 300 240 T 600 240 T 900 240 T 1200 240 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="-300 0; 0 0" dur="11s" repeatCount="indefinite"/>
    </path>

    <text x="450" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="1">
      Emre Çancıoğlu
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <!-- rotating roles -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#e6f6ff" text-anchor="middle">
      <text x="450" y="152" opacity="0">Digitalization &amp; AI Supervisor
        <animate attributeName="opacity" values="0;1;1;0;0;0;0;0" keyTimes="0;0.06;0.28;0.34;0.4;0.7;0.9;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="450" y="152" opacity="0">OT · PLC · SCADA · MES
        <animate attributeName="opacity" values="0;0;0;1;1;0;0;0" keyTimes="0;0.3;0.34;0.4;0.62;0.68;0.9;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="450" y="152" opacity="0">Applied AI · Computer Vision · GenAI
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.3;0.6;0.66;0.72;0.94;1;1" dur="12s" repeatCount="indefinite"/></text>
    </g>
    <text x="450" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.75" letter-spacing="3">
      RESUME  ·  COVER LETTER  ·  ÖZGEÇMİŞ  ·  ÖN YAZI
    </text>
    <rect x="360" y="204" width="180" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.6">
      <animate attributeName="width" values="0;180;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="450;360;450" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
